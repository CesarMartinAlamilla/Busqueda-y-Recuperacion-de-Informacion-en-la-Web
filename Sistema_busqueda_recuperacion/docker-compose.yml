services:
  solr:
    image: solr:10.0.0
    container_name: solr-ri
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
      - ./config:/opt/solr_custom_config:ro
    command:
      - bash
      - -c
      - >-
        source run-initdb &&
        precreate-core ri &&
        precreate-core buscador_es &&
        cp -f /opt/solr_custom_config/* /var/solr/data/ri/conf/ &&
        cp -f /opt/solr_custom_config/* /var/solr/data/buscador_es/conf/ &&
        exec solr-fg --user-managed
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8983/solr/buscador_es/admin/ping >/dev/null && curl -fsS http://localhost:8983/solr/ri/admin/ping >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - solr_net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buscador-web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - SOLR_URL=http://solr:8983/solr/buscador_es
    depends_on:
      solr:
        condition: service_healthy
    networks:
      - solr_net
    restart: unless-stopped

volumes:
  solr_data:

networks:
  solr_net:
    driver: bridge
